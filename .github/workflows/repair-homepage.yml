name: Repair homepage HTML
on:
  push:
    paths:
      - index.html
      - .github/workflows/repair-homepage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode markup only if escaped
        run: |
          python3 -c "from pathlib import Path; import html; p=Path('index.html'); t=p.read_text(encoding='utf-8'); p.write_text(html.unescape(t) if t.startswith('&lt;!doctype html') else t, encoding='utf-8')"
      - name: Commit repaired HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Repair homepage HTML tags"
            git push
          fi
